<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="/Estudi-finanzas-master/css/style2.css">
</head>
<body>
        <!-- BOTONES LATERALES DE CONTRASTE (LADO DERECHO) -->
    <div id="contraste-buttons" class="contraste-buttons">
    <button id="aumentarfuente" class="contraste-btna">+</button>
    <button id="disminuirfuente" class="contraste-btn">−</button>
    <button id="contraste" class="contraste-label">◑</button>
</div>

    <header id="main-header" class="main-header">
        <div class="container">
            <div id="logo">
                <h1>Estudi Finanzas</h1>
            </div>
            <nav id="main-nav" class="main-nav">
                <ul>
                    <li><a href="/Estudi-finanzas-master/index.html" class="active">Inicio</a></li>
                    <li><a href="/Estudi-finanzas-master/pages/correcciones.html">Modificación</a></li>
                    <li><a href="/Estudi-finanzas-master/pages/conceptos.html">Conceptos</a></li>
                    <li><a href="/Estudi-finanzas-master/pages/librosyplantillas.html">Libros de ayuda</a></li>
                    <li><a href="">Noticias</a></li>
                    <!-- NUEVO: Botón CONTACTANOS en el menú -->
                    <li><a href="/Estudi-finanzas-master/pages/contacto.html">CONTACTANOS</a></li>
                </ul>
            </nav>
        </div>
    </header>
                <!--pagina contactos-->

                <!-- SECCIÓN CONTACTO (anclada) -->
                <div id="contacto" class="contact-section">
                    <h3 class="contact-title">Dejanos tu mensaje, No se admiten mensajes duplicados</h3>
                    
                    <form id="contact-form" class="contact-form">
                        <div class="form-group" id="group-nombre">
                            <label for="nombre">Nombre completo:</label>
                            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre">
                        </div>

                        <div class="form-group" id="group-email">
                            <label for="email">Correo electrónico:</label>
                            <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com">
                        </div>

                        <div class="form-group" id="group-telefono">
                            <label for="telefono">Teléfono (opcional):</label>
                            <input type="tel" id="telefono" name="telefono" placeholder="Tu teléfono">
                        </div>

                        <div class="form-group" id="group-mensaje">
                            <label for="mensaje">Mensaje:</label>
                            <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..."></textarea>
                        </div>

                        <button type="submit" id="btn-enviar" class="btn-enviar">Enviar mensaje</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <footer id="main-footer" class="main-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-copyright">
                    <p>Derechos reservados Estudi Finanzas 2026</p>
                </div>
            </div>
        </div>
    </footer>
    <script src="/Estudi-finanzas-master/assest/Dist/main.js"></script>
</body>
</html>
